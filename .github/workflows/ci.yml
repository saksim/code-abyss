name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run verify:skills
      - run: npm run verify:skill-system
      - run: npm run packs:check
      - run: npm run packs:vendor:sync -- --check
      - run: node personal-skill-system/skills/tools/verify-change/scripts/run.js --mode staged || node personal-skill-system/skills/tools/verify-change/scripts/run.js --mode working
      - run: node personal-skill-system/skills/tools/verify-module/scripts/run.js .
      - run: node personal-skill-system/skills/tools/verify-quality/scripts/run.js .
      - run: node personal-skill-system/skills/tools/verify-security/scripts/run.js .

  smoke-tarball:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [claude, codex, gemini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Smoke install/uninstall tarball target
        run: npm run verify:tarball-smoke -- --targets ${{ matrix.target }}
